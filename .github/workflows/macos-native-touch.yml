name: macOS native touch

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'examples/macos-native-touch/**'
      - 'libs/base/protos/message.proto'
      - 'libs/base/src/native_touch.rs'
      - 'src/native_touch.rs'
      - 'src/platform/macos/native_touch.rs'
      - 'src/server/connection/native_touch.rs'
      - 'flutter/lib/utils/native_touch.dart'
      - 'flutter/lib/models/native_touch_model.dart'
      - 'flutter/lib/common/widgets/native_touch.dart'
      - 'flutter/test/native_touch*'
      - '.github/workflows/macos-native-touch.yml'
  push:
    branches: [master, deploy]
    paths:
      - 'examples/macos-native-touch/**'
      - 'libs/base/protos/message.proto'
      - 'libs/base/src/native_touch.rs'
      - 'src/native_touch.rs'
      - 'src/platform/macos/native_touch.rs'
      - 'src/server/connection/native_touch.rs'
      - 'flutter/lib/utils/native_touch.dart'
      - 'flutter/lib/models/native_touch_model.dart'
      - 'flutter/lib/common/widgets/native_touch.dart'
      - 'flutter/test/native_touch*'
      - '.github/workflows/macos-native-touch.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - run: swift test --package-path examples/macos-native-touch
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --locked -p base --lib native_touch
      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2
        with:
          flutter-version: '3.24.5'
          architecture: arm64
          cache: true
      - run: flutter pub get
        working-directory: flutter
      - run: flutter test --no-pub test/native_touch_test.dart
        working-directory: flutter
